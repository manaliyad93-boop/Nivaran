<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIVARAN | Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <div class="screen">

        <!-- LEFT PANEL (1/3 BANNER) -->
        <div class="header">
            <div class="secure">CSJM PORTAL</div>
            <div class="logo">NIVARAN<span>.AI</span></div>
            <div class="tagline">Create Your Official Account for AI-Assisted Support</div>
        </div>

        <!-- RIGHT PANEL (2/3 REGISTRATION FORM) -->
        <div class="card">
            
            <a href="form.html" class="back">← Back to Login</a>

            <div class="card-content-wrapper">
                
                <h2>Register Account</h2>
                <p class="card-subtitle">Enter your details to register on the NIVARAN Portal</p>

                <form>
                    <!-- Role Selection -->
                    <label class="unique-label">Register As</label>
                    <div class="role-selector">
                        <label class="role-option">
                            <input type="radio" name="role" value="student" checked>
                            <span>User</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="faculty">
                            <span>Authority</span>
                        </label>
                    </div>

                    <!-- Full Name -->
                    <label class="unique-label">Full Name</label>
                    <div class="input-row">
                        <div class="input-icon">👤</div>
                        <input type="text" class="form-input" placeholder="Enter your full name" required>
                    </div>


                    <!-- Official Email -->
                    <label class="unique-label">Email Address</label>
                    <div class="input-row">
                        <div class="input-icon">✉️</div>
                        <input type="email" class="form-input" placeholder="student@csjmu.ac.in" required>
                    </div>

                    <!-- Password -->
                    <label class="unique-label">Password</label>
                    <div class="input-row">
                        <div class="input-icon">🔒</div>
                        <input type="password" class="form-input" placeholder="Create strong password" required>
                    </div>

                    <!-- Terms Checkbox -->
                    <div class="options">
                        <label class="terms">
                            <input type="checkbox" required>
                            <span>I agree to the <a href="#">Terms & Conditions</a></span>
                        </label>
                    </div>

                    <!-- Action Button -->
                    <button type="submit" class="signup-btn">Create Account</button>

                    <!-- Existing User Link -->
                    <p class="login-prompt">
                        Already have an account? <p class="login-prompt">
                     Already have an account? <a href="form.html">Sign In</a>
                     </p>
                </form>

            </div>

        </div>

    </div>

</body>

</html>
