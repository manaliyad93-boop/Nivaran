<<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIVARAN Portal - Select Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="container">

        <header class="header">
            <span class="badge">AI-POWERED PLATFORM</span>

            <h1>NIVARAN</h1>

            <p>
                Next-Gen Grievance Redressal & Resolution System
            </p>
        </header>


        <div class="login-options">

            <!-- USER LOGIN -->
            <div class="login-card">

                <div class="card-icon">👤</div>

                <h2>User Login</h2>

                <p>
                    Submit, track, and manage your personal grievances instantly.
                </p>

                <button
                    class="btn btn-primary"
                    onclick="window.location.href='form.html'">
                    Continue as User &rarr;
                </button>

            </div>


            <!-- AUTHORITY LOGIN -->
            <div class="login-card highlight">

                <div class="card-icon">🏛️</div>

                <h2>Authority Login</h2>

                <p>
                    Manage, route, and resolve system-wide grievances efficiently.
                </p>

                <button
                    class="btn btn-secondary"
                    onclick="window.location.href='form.html'">
                    Continue as Authority &rarr;
                </button>

            </div>

        </div>

    </div>

</body>

</html>
